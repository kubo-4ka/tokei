<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>シンプル時計</title>
  <meta name="description" content="背景や文字の色・大きさ・フォント、地域（タイムゾーン）、曜日、日本語／英語、秒やミリ秒などを自由に変えられる、ずっと表示しておくためのシンプルな時計。">
  <meta name="theme-color" content="#0b0b10">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="時計">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- 時計のフォント（設定で選んだもの）。app.js が href を入れ替える -->
  <link id="clockFont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;800&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // 保存した背景色を先に塗って、起動時のちらつきを防ぐ
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('tokei.settings') || 'null');
        if (s && s.bg1) {
          var r = document.documentElement.style;
          r.setProperty('--bg1', s.bg1);
          r.setProperty('--bg2', s.bgMode === 'gradient' && s.bg2 ? s.bg2 : s.bg1);
          r.setProperty('--fg', s.fg || '#f4f1ea');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="idle">
  <main class="stage" id="stage" aria-live="off">
    <div class="clock" id="clock">
      <div class="city" id="city" hidden></div>
      <div class="date" id="date" hidden></div>
      <div class="time" id="time" role="timer" aria-label="現在の時刻"></div>
      <div class="zones" id="zones" hidden></div>
    </div>
    <div class="time measure" id="measure" aria-hidden="true"></div>
  </main>

  <div class="dim" id="dim" aria-hidden="true"></div>

  <div class="controls" id="controls">
    <button class="ctl" id="fsBtn" type="button" title="全画面（F）" aria-label="全画面">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="fs-on"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <svg viewBox="0 0 24 24" aria-hidden="true" class="fs-off"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
    </button>
    <button class="ctl" id="setBtn" type="button" title="設定（S）" aria-label="設定" aria-controls="panel" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <aside class="panel" id="panel" aria-label="設定" hidden>
    <header class="panel-head">
      <h1>設定</h1>
      <button class="close" id="closeBtn" type="button" aria-label="設定を閉じる" title="閉じる（Esc）">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
